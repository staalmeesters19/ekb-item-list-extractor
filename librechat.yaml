# LibreChat configuration — Agyle Parts Extract endpoint
# Loaded by LibreChat from the public URL set via CONFIG_PATH env var.
# Spec: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.2.5
cache: false

endpoints:
  custom:
    - name: 'EKB ProCos Matcher'
      apiKey: '${AGYLE_API_KEY}'
      baseURL: 'https://agyle-api-production.up.railway.app/v1'
      models:
        default:
          - 'agyle_parts_extract'
        fetch: true
      titleConvo: false
      modelDisplayLabel: 'EKB ProCos Matcher'

# File-upload config — allow PDFs and ALL Office formats via "Upload to
# Provider". The patterns are regex (LibreChat uses RegExp on each entry),
# so we widen them: any `application/vnd.*` (covers all Office MIMEs
# including xlsx/docx/xltm), plus PDF and octet-stream (browser fallback
# when the MIME is unknown).
fileConfig:
  endpoints:
    "EKB ProCos Matcher":
      fileLimit: 5
      fileSizeLimit: 25
      totalSizeLimit: 50
      supportedMimeTypes:
        - "application/pdf"
        - "application/vnd\\.openxmlformats-officedocument\\..*"
        - "application/vnd\\.ms-excel.*"
        - "application/vnd\\.ms-office.*"
        - "application/octet-stream"
        - "application/x-zip-compressed"
  serverFileSizeLimit: 100
